<!DOCTYPE html>
<h1>Добро пожаловать, <span id="welcome-name">Гость</span>!</h1>
<a id="btn-hw" href="#" class="menu-btn">Загрузить ДЗ</a>
<a id="btn-video" href="#" class="menu-btn">Смотреть урок</a>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет ученика — M.J.School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Задний фон с контурными изображениями — как поля вокруг */
        .bg-image-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
            filter: brightness(130%) contrast(130%);
            mix-blend-mode: multiply;
        }

        /* Белый блок — теперь крупнее, с большими полями */
        .content-box {
            width: 100%;
            max-width:1600px;    
            min-height:100px;      
            background-color: #ffffff;
            padding: 10px 80px;      /* больше отступы внутри */
            border: 6px solid #f9f9f9;
            border-radius: 20px;     /* чуть более скруглённые углы */
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 3;
            min-height:200px;
            text-align: left;
            line-height: 1.3;
            font-size: 70px;        /* крупнее заголовок */
            font-weight: 600;
            color: #2c3e50;
        }
        
        h1 span {
            display: inline-block;
            font-size: 90px;
            color: #0a47ff;
        }

        /* Сетка из 6 кнопок — теперь точно влезает */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;              /* чуть больше расстояние между кнопками */
            margin-top: 35px;
        }

        .dashboard-btn {
    display: block;
    padding: 16px 28px;        /* ← чуть меньше, чем раньше, чтобы компенсировать крупный текст */
    background: linear-gradient(135deg, #5c8af6 0%, #4242c1 100%);
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;           /* ← крупнее текст */
    line-height: 1.3;          /* ← чтобы строки не слипались */
    border-radius: 54px;
    box-shadow: 0 10px 24px rgba(92, 102, 246, 0.45);
    transition: all 0.3s ease;
    text-align: center;
    white-space: nowrap;
}

        .dashboard-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 32px rgba(100, 92, 246, 0.55);
        }

        /* Кнопка поддержки (фиксированная) */
        #support-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background-color: #2f52ed;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            z-index: 999999;
            border: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s, background-color 0.2s;
            font-family: Arial, sans-serif;
            outline: none;
            margin: 0;
            padding: 0;
        }
        #support-btn:hover {
            transform: scale(1.15);
            background-color: #182afb;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Окно чата поддержки */
        #chat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999998;
            display: none;
            justify-content: flex-end;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #chat-overlay.active {
            display: flex;
            opacity: 1;
        }

        #chat-window {
            width: 340px;
            background: white;
            border: 2px solid #293ceb;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.35);
            position: relative;
            transform: translateX(24px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999999;
        }
        #chat-overlay.active #chat-window {
            transform: translateX(0);
        }

        #chat-header {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #close-chat {
            background: none;
            border: none;
            color: #3a30e8;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }

        .contact-option {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
            cursor: pointer;
            box-sizing: border-box;
        }
        .contact-option:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-tg { background-color: #229ED9; }
        .btn-MAX { background-color: #1d05f0; }
        .btn-phone { background-color: #6f42c1; }

        .close-overlay-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }
    </style>
</head>
<script>
    // 1. Получаем имя из ссылки (dashboard.html?u=alina)
    const params = new URLSearchParams(window.location.search);
    const userKey = params.get('u'); 

    // 2. Загружаем базу данных (твой students.json)
    fetch('students.json')
        .then(response => response.json())
        .then(data => {
            if (data[userKey]) {
                const student = data[userKey];
                
                // 3. Вставляем имя
                document.getElementById('welcome-name').textContent = student.name;
                
                // 4. Вставляем ссылки (находим элементы по ID и меняем href)
                document.getElementById('btn-hw').href = student.hw_link;
                document.getElementById('btn-video').href = student.video_link;
                
                // Если нужно, можно менять текст кнопок
                document.getElementById('btn-hw').textContent = '📘 Твоя домашка';
            } else {
                document.getElementById('welcome-name').textContent = 'Ученик не найден';
            }
        })
        .catch(error => console.error('Ошибка:', error));
</script>
