<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конспекты — M.J.School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-image-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
            filter: brightness(130%) contrast(130%);
            mix-blend-mode: multiply;
        }

        .content-box {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 40px;
            border: 6px solid #f9f9f9;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 24px;
            line-height: 1.3;
            font-size: 32px;
            font-weight: 700;
        }
        h1 span {
            color: #0a47ff;
        }

        .note-item {
            border: 1px solid #eee;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: #f8f9fa;
        }
        .note-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .note-link {
            color: #5c8af6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .note-link:hover {
            color: #4242c1;
        }

        #support-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background-color: #2f52ed;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            z-index: 999999;
            border: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s, background-color 0.2s;
            font-family: Arial, sans-serif;
            outline: none;
            margin: 0;
            padding: 0;
        }
        #support-btn:hover {
            transform: scale(1.15);
            background-color: #182afb;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <!-- Фон -->
    <div class="bg-image-wrapper">
        <img src="school-border.jpg" alt="Школьные контуры" />
    </div>

    <!-- Белый блок -->
    <div class="content-box">
        <h1>Конспекты<br><span>M.J.School</span></h1>

        <!-- Конспект 1 (PDF) -->
        <div class="note-item">
            <div class="note-title">Урок 1: Квадратные уравнения</div>
            <a href="notes/lesson1.pdf" class="note-link" target="_blank">📄 Открыть конспект (PDF)</a>
            или <a href="notes/lesson1.pdf" class="note-link" download>⬇️ Скачать PDF</a>
        </div>
